   <text style="font-size: 7.5px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="8.64" y="264.30425" transform="rotate(-0 8.64 264.30425)">One dot per video. Slide-heavy recordings (thousands of OCR lines per hour) are the slow ones on the CPU build.</text>

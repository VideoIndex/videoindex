[package]
name = "vi-cli"
description = "The `vi` command-line interface for VideoIndex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# ONNX Runtime CUDA execution provider for the in-process models.
cuda = ["vi-perceive/cuda"]

[[bin]]
name = "vi"
path = "src/main.rs"

[dependencies]
vi-core = { workspace = true }
vi-media = { workspace = true }
vi-index = { workspace = true }
vi-pipeline = { workspace = true }
vi-perceive = { workspace = true }
vi-query = { workspace = true }
vi-providers = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { workspace = true }
which = { workspace = true }
humansize = { workspace = true }

[dev-dependencies]
vi-testkit = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

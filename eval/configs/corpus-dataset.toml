# Corpus QA over the 30-video dataset index: questions that span the library
# (which talks mention X, moments about a topic, cross-video synthesis, whole-
# library summaries). Run with
#   python3 -m eval.run eval/configs/corpus-dataset.toml [--run-reference] [--jobs 3]
# which answers, judges (Claude Opus 5) and writes docs/results/corpus-<date>.md
# (add --pdf <path> for the PDF report).
benchmark = "corpus"
index = "/data/videoindex/indexes/dataset.vidx"
config = "config/gcp-a100.toml"
runs_dir = "/data/videoindex/eval/runs/corpus"

# Run names carry a suffix for the agent version: the runner resumes any
# existing run file, so a change to the tools or the prompt needs a new name
# (the old file stays and is reported as a comparison row).
#   (no suffix)  2026-09-16: search / get_transcript / view agent
#   -v2          2026-09-17: find_mentions, count_mentions, library_stats,
#                search per_video_k (EVAL-IMPROVEMENTS workstreams A and B)
[[runs]]
name = "vi-agent-sonnet-v2"
system = "videoindex"
policy = "agent"
label = "VideoIndex agent with library tools (claude-sonnet-5)"

[[runs]]
name = "vi-agent-gemini-v2"
system = "videoindex"
policy = "agent"
model = "gemini-3.8-flash"
label = "VideoIndex agent with library tools (gemini-3.8-flash)"

[[runs]]
name = "vi-retrieval-only-v2"
system = "videoindex"
policy = "retrieval-only"
label = "VideoIndex retrieval-only with per-video cap (claude-sonnet-5)"

# External reference: Gemini agentic video, map-reduce over batches of 10 files
# (the API's per-request maximum) plus a merge call. Run once (--run-reference),
# cached afterwards.
[[runs]]
name = "gemini-agentic"
system = "gemini"
reference = true
model = "gemini-3.8-flash"
batch_size = 10

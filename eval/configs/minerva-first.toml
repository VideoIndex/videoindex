# MINERVA: agent, retrieval-only and uniform-sampling baseline.
benchmark = "minerva"
root = "/data/videoindex/eval/minerva"
index = "/data/videoindex/indexes/eval-minerva.vidx"
config = "config/gcp-a100.toml"

[[runs]]
name = "agent"
policy = "agent"
max_tool_calls = 6
budget_usd = 0.5
budget_tokens = 120000

# The agent of 2026-09-17 (library tools, per-video search cap, routed
# prompt) with the default Sonnet 5 chat model, like-for-like with the
# Gemini row below; the "agent" row above is the 2026-09-14 agent.
[[runs]]
name = "agent-v2"
policy = "agent"
label = "agent 2026-09-17 (claude-sonnet-5)"
max_tool_calls = 6
budget_usd = 0.5
budget_tokens = 120000

# Same agent with Gemini 3.8 Flash as the chat model (EVAL-IMPROVEMENTS G).
[[runs]]
name = "agent-gemini"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-17 (gemini-3.8-flash)"
max_tool_calls = 6
budget_usd = 0.5
budget_tokens = 120000

# Tool-budget experiment (KICKOFF-tool-budget-2026-09-18): the same 2026-09-17
# agent and chat model with the call cap raised from 6 to 12, no code change.
[[runs]]
name = "agent-gemini-tc12"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-17 (gemini-3.8-flash, 12 tool calls)"
max_tool_calls = 12
budget_usd = 0.5
budget_tokens = 120000

# The 2026-09-21 agent (multi-window tools, concurrent calls, exhausted-turn
# nudge; EVAL-IMPROVEMENTS J) at 12 calls: paired with the two rows above.
[[runs]]
name = "agent-gemini-v3-tc12"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-21 (gemini-3.8-flash, 12 tool calls)"
max_tool_calls = 12
budget_usd = 0.5
budget_tokens = 120000

# The 2026-09-25 agent (KICKOFF-view-fix-2026-09-25): multi-window `view` as a
# comparison tool (16 frames per grid, each window at most 60 s, description
# reserved for moments already found), a continue-once after an output-length
# stop, and a "two to four calls per turn" prompt line. Paired with the two
# 12-call rows above.
[[runs]]
name = "agent-gemini-v4-tc12"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-25 (gemini-3.8-flash, 12 tool calls)"
max_tool_calls = 12
budget_usd = 0.5
budget_tokens = 120000

# The 2026-09-26 agent: the text tools take at most 3 windows with at least
# 4,000 characters each and are described for ranges already located (the
# six-window sweep was the remaining cause of the 09-21 regression; branch
# exp/text-tools-ablation, DECISIONS 2026-09-26).
[[runs]]
name = "agent-gemini-v5-tc12"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-26 (gemini-3.8-flash, 12 tool calls)"
max_tool_calls = 12
budget_usd = 0.5
budget_tokens = 120000

# The protocol ladder (vi_internal DECISIONS 2026-09-28): P1 = 12 calls / $0.50 /
# 120k tokens / 120 s (the historical results-page protocol); P2 = 20 calls /
# $0.30 / 400k tokens / 300 s (the demo's cap since 2026-09-29, the headline
# protocol from that date); P3 = 30 / $0.75 / 1M / 600 s. The cost cap is the
# binding limit by design. The unchanged 2026-09-26 agent at P2 is the control
# for the 2026-09-29 agent at P2.
[[runs]]
name = "agent-gemini-v5-P2"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-26 (gemini-3.8-flash, P2: 20 calls, $0.30)"
max_tool_calls = 20
budget_usd = 0.30
budget_tokens = 400000
budget_secs = 300

# The 2026-09-29 agent: `zoom` (one frame at source resolution with an optional
# enlarged region) and `view detail` (six 896 px tiles over at most 15 s), the
# tool for small things in a frame already found (idea 3.1; DECISIONS
# 2026-09-28 and 2026-09-29). Measured at P1 for comparison with the rows
# above, at P2 (the headline) and at P3.
[[runs]]
name = "agent-gemini-v7-tc12"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-29 (gemini-3.8-flash, 12 tool calls)"
max_tool_calls = 12
budget_usd = 0.5
budget_tokens = 120000

[[runs]]
name = "agent-gemini-v7-P2"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-29 (gemini-3.8-flash, P2: 20 calls, $0.30)"
max_tool_calls = 20
budget_usd = 0.30
budget_tokens = 400000
budget_secs = 300

[[runs]]
name = "agent-gemini-v7-P3"
policy = "agent"
model = "gemini-3.8-flash"
label = "agent 2026-09-29 (gemini-3.8-flash, P3: 30 calls, $0.75)"
max_tool_calls = 30
budget_usd = 0.75
budget_tokens = 1000000
budget_secs = 600

[[runs]]
name = "retrieval-only"
policy = "retrieval-only"

[[runs]]
name = "uniform-32"
baseline = "uniform"
frames = 32
model = "claude-sonnet-5"

# External reference, run once per sample (eval.run --run-reference) and cached;
# every later report includes the cached file.
[[runs]]
name = "gemini-3.8-flash-agentic"
baseline = "gemini"
reference = true
model = "gemini-3.8-flash"
mode = "agentic"

[package]
name = "videoindex-node"
description = "Node.js binding for VideoIndex (napi-rs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vi-core = { workspace = true }
vi-index = { workspace = true }
vi-media = { workspace = true }
vi-perceive = { workspace = true }
vi-providers = { workspace = true }
vi-pipeline = { workspace = true }
vi-query = { workspace = true }
vi-agent = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi9", "async", "serde-json"] }
napi-derive = "3"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true

[graph]
all-features = false
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # paste: unmaintained proc-macro crate reached through `tokenizers`; no
  # runtime code, and tokenizers has not yet moved to a fork.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause", # numpy crate (Python binding)
  "ISC",
  "Zlib",
  "WTFPL",
  "Unicode-3.0",
  "CDLA-Permissive-2.0", # webpki-roots: Mozilla's root certificate store, used by rustls
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

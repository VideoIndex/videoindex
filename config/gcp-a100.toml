# VideoIndex configuration for the GCP A100 indexing machine (machine notes: vi_internal/docs/machines/MACHINE.md).
# Use with `vidx --config config/gcp-a100.toml ...` or `export VI_CONFIG=$PWD/config/gcp-a100.toml`.

default_policy = "auto"   # coarse_only here, since every role below is bound

[media]
cache_dir = "/data/videoindex/videos"

[models]
dir = "/data/videoindex/models"
device = "auto"          # cuda when built with --features cuda and the CUDA libs exist, else cpu

[models.asr]
language = "en"
skip_if_human_subtitles = false
concurrency = 4

# Local Whisper server: scripts/asr_server.sh start
[providers.whisper_local]
adapter = "openai_compat"
base_url = "http://127.0.0.1:9000/v1"
model = "large-v3"
concurrency = 4
timeout_secs = 600
max_retries = 4

# Hosted models for the agent and extraction (key in $ANTHROPIC_API_KEY).
[providers.claude]
adapter = "anthropic"
model = "claude-sonnet-5"
concurrency = 4
requests_per_minute = 50

# Alternative chat model for `vidx ask --model gemini-3.8-flash` and the server's
# `model` field, and the model behind vlm_describe (see [roles]); key in
# $GEMINI_API_KEY, from the git-ignored .env.
[providers.gemini]
adapter = "gemini"
model = "gemini-3.8-flash"
concurrency = 4
requests_per_minute = 50

# The escalation model for `vidx ask --escalate gemini_pro` and the server's
# `escalate` field (protocol P2E on the results pages): a second pass from
# scratch when the Flash pass ends at the tool-call cap or partial. List
# price $2 / $12 per Mtok (2026-10-02); same key as `gemini`.
[providers.gemini_pro]
adapter = "gemini"
model = "gemini-3.1-pro-preview"
concurrency = 4
requests_per_minute = 50
pricing = { input_per_mtok = 2.0, output_per_mtok = 12.0 }
# The Gemini 3 Pro models loop and degrade at the loop's default temperature
# of 0 (a quarter of the answers on 2026-10-02); their documented default.
temperature = 1.0

# In-process ONNX models (SigLIP, RapidOCR, bge-small).
[providers.local]
adapter = "onnx_local"
model_dir = "/data/videoindex/models"

[roles]
asr = { provider = "whisper_local" }
ocr = { provider = "local" }
image_embed = { provider = "local" }
text_embed = { provider = "local" }
agent_llm = { provider = "claude" }
# The per-shot descriptions that moved LVBench (+15 and +10 against the two
# 2026-10-03/04 bases; vi_internal DECISIONS 2026-10-04) were Gemini 3.8
# Flash's, at $0.0030 a shot: $0.82 an hour of LVBench video (271 shots an
# hour), $0.45 an hour of MINERVA video (153 shots an hour). The same pass
# with the Claude binding would cost about ten times that. This role also
# serves the agent's on-demand `describe` tool (roles::VLM_DESCRIBE in
# crates/vi-agent/src/tools.rs), which therefore moves from Claude Sonnet 5
# to Gemini 3.8 Flash too (it is called on 3-8% of the benchmark
# questions); a separate role for the tool is a possible later split.
vlm_describe = { provider = "gemini" }
extract_llm = { provider = "claude" }

# The built-in coarse_only policy without a wall-clock limit: this machine
# also builds and tests while it indexes, and a cut-off would skip OCR and
# embeddings instead of waiting.
[policy.coarse_only]
sample_fps = 1.0
coarse = ["subtitle_import", "vad", "asr", "sample", "shot_boundary", "phash", "thumbnail", "image_embed", "ocr", "text_embed"]
fine = []
max_cost_usd_per_hour = 0.0
max_wallclock_per_hour = "0"

# Coarse pass with speech recognition; the rest of lecture_default lands
# operator by operator.
[policy.coarse_asr]
sample_fps = 1.0
coarse = ["subtitle_import", "vad", "asr", "sample", "shot_boundary", "phash", "thumbnail", "image_embed", "ocr", "text_embed"]
fine = []
max_cost_usd_per_hour = 0.0
max_wallclock_per_hour = "20m"

# Visual-only pass for checking shot detection and thumbnails quickly.
[policy.visual]
sample_fps = 1.0
coarse = ["sample", "shot_boundary", "phash", "thumbnail", "image_embed", "ocr", "text_embed"]
fine = []
max_cost_usd_per_hour = 0.0
max_wallclock_per_hour = "10m"

# Full pass with the fine stages (VLM descriptions and extraction cost money).
[policy.full]
sample_fps = 1.0
coarse = ["subtitle_import", "vad", "asr", "sample", "shot_boundary", "phash", "thumbnail", "image_embed", "ocr"]
fine = ["scenes", "chapters", "vlm_describe", "entities_events", "text_embed"]
# One vlm_describe call per shot instead of one per scene, with a fixed
# schema (people, objects with counts, actions, on-screen text, a
# one-sentence summary): with Gemini 3.8 Flash $0.0030 a shot, $0.82 an
# hour of LVBench video (271 shots an hour), $0.45 an hour of MINERVA
# video (153 shots an hour). The densest eval video (861 shots an hour)
# costs about $2.84 an hour for this stage alone (at the pilot's $0.0033
# a shot), so with the other fine stages max_cost_usd_per_hour = 3.0 is
# close to binding on such videos: the pass then stops describing early,
# and a later run with a higher cap describes only the shots still missing.
describe_level = "shot"
vlm_grid = "3x3"
max_cost_usd_per_hour = 3.0
max_wallclock_per_hour = "30m"
